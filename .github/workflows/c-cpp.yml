name: Build MREmu (Windows)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
        build_type: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Extract MRE SDK
        shell: pwsh
        run: |
          Expand-Archive -Path mre.zip -DestinationPath sdk -Force

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DMRE_SDK_PATH="${{ github.workspace }}/sdk"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MREmu-windows-${{ matrix.arch }}-${{ matrix.build_type }}
          path: bin/
          if-no-files-found: error
