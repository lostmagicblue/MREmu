name: Build MREmu

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Update submodules
      run: git submodule update --init --recursive

    # 1. 解压项目根目录下的 include.zip 覆盖合并到 include 目录
    - name: Extract SDK Headers
      shell: powershell
      run: |
        if (Test-Path "include.zip") {
            # -Force 会在保持原有文件的基础上，覆盖同名文件
            Expand-Archive -Path "include.zip" -DestinationPath "." -Force
            Write-Host "Successfully extracted SDK headers into include directory."
        } else {
            Write-Error "include.zip not found in repository root!"
            exit 1
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # 2. 配置 CMake 并生成 Visual Studio 工程
    - name: Configure CMake
      shell: powershell
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release

    # 3. 执行编译
    - name: Build project
      shell: powershell
      run: |
        cmake --build build --config Release

    # 4. 打包并上传生成的 Build 产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MREmu-Windows-Release
        path: |
          bin/
          build/bin/Release/
          build/Release/
          build/MREmu/Release/
