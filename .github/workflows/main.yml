name: Build MREmu

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Update submodules
      run: git submodule update --init --recursive

    # 1. 真实静默安装 SDK
    - name: Download and install MRE SDK
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/raspiduino/mre-sdk/releases/download/1.0.0/MRE_SDK_3.0.00.20_Normal_Eng.zip" -OutFile "mre-sdk.zip"
        Expand-Archive -Path "mre-sdk.zip" -DestinationPath "mre-sdk-temp"
        
        $installerPath = "mre-sdk-temp\MRE_SDK_3.0.00.20_Normal_Eng.exe"
        Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"C:\Program Files (x86)\MRE SDK V3.0.00`"" -Wait
        
        $sdkDir = "C:\Program Files (x86)\MRE SDK V3.0.00"
        $includeDir = "$sdkDir\include"
        
        if (Test-Path "$includeDir\vmgraph.h") {
            Write-Host "SDK Successfully verified at: $sdkDir"
            
            # 将环境变量写入 GITHUB_ENV，确保后续所有 Step 都能读取到
            "MRE_SDK=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MRE_SDK_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MRE_SDK_PATH=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "INCLUDE=$env:INCLUDE;$includeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
            Write-Error "Failed to locate vmgraph.h in $includeDir"
            exit 1
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # 2. 配置 CMake（多管齐下指向 SDK 路径）
    - name: Configure CMake
      shell: powershell
      run: |
        $sdkDir = "C:/Program Files (x86)/MRE SDK V3.0.00"
        $incDir = "C:/Program Files (x86)/MRE SDK V3.0.00/include"
        
        cmake -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DMRE_SDK="$sdkDir" `
          -DMRE_SDK_DIR="$sdkDir" `
          -DMRE_SDK_PATH="$sdkDir" `
          -DCMAKE_INCLUDE_PATH="$incDir" `
          -DCMAKE_CXX_FLAGS="/I`"$incDir`"" `
          -DCMAKE_C_FLAGS="/I`"$incDir`""

    # 3. 编译
    - name: Build project
      shell: powershell
      run: |
        cmake --build build --config Release

    # 4. 上传二进制产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MREmu-Windows-Release
        path: |
          bin/
          build/bin/Release/
          build/Release/
          build/MREmu/Release/
