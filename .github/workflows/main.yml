name: Build MREmu

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Update submodules
      run: git submodule update --init --recursive

    # 1. 下载并提取 SDK，还原与本地完全一致的 SDK 根目录结构
    - name: Download and extract MRE SDK
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/raspiduino/mre-sdk/releases/download/1.0.0/MRE_SDK_3.0.00.20_Normal_Eng.zip" -OutFile "mre-sdk.zip"
        Expand-Archive -Path "mre-sdk.zip" -DestinationPath "mre-sdk-temp"
        
        choco install innoextract -y
        innoextract mre-sdk-temp/MRE_SDK_3.0.00.20_Normal_Eng.exe -d "$env:GITHUB_WORKSPACE/mre-sdk-temp-extracted"
        
        # 寻找 vmgraph.h，并将其上级 include 的父目录设定为标准 SDK 根目录
        $vmHeader = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/mre-sdk-temp-extracted" -Filter "vmgraph.h" -Recurse | Select-Object -First 1
        if ($vmHeader) {
            # 真实包含 include, lib, tools 的 SDK 根路径
            $realSdkRoot = $vmHeader.Directory.Parent.FullName
            $includeDir = $vmHeader.Directory.FullName
            
            Write-Host "Found Standard SDK Root at: $realSdkRoot"
            
            # 设置环境变量，传递给后续步骤
            "MRE_SDK=$realSdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MRE_SDK_DIR=$realSdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MRE_SDK_PATH=$realSdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "INCLUDE=$env:INCLUDE;$includeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
            Write-Error "Could not find vmgraph.h in extracted files!"
            exit 1
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # 2. 配置 CMake
    - name: Configure CMake
      shell: powershell
      run: |
        cmake -B build `
          -DMRE_SDK="$env:MRE_SDK" `
          -DMRE_SDK_DIR="$env:MRE_SDK" `
          -DMRE_SDK_PATH="$env:MRE_SDK"

    # 3. 编译
    - name: Build project
      shell: powershell
      run: |
        cmake --build build --config Release

    # 4. 打包构建产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MREmu-Windows-Release
        path: |
          bin/
          build/bin/Release/
          build/Release/
          build/MREmu/Release/
