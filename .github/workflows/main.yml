name: Build MREmu on Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Install OpenAL
      shell: pwsh
      run: |
        # 静默安装 OpenAL
        Invoke-WebRequest -Uri "https://www.openal.org/downloads/oalinst.zip" -OutFile "oalinst.zip"
        Expand-Archive -Path "oalinst.zip" -DestinationPath "oalinst"
        Start-Process -FilePath "oalinst\oalinst.exe" -ArgumentList "/S" -Wait

    - name: Extract MRE SDK from Repo
      shell: pwsh
      run: |
        # 直接解压仓库根目录下自带的 mre.zip，再也不怕外网下载断连了
        Expand-Archive -Path "mre.zip" -DestinationPath "mre_sdk"
        # 确认路径写入环境变量
        echo "MRE_SDK=$env:GITHUB_WORKSPACE\mre_sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Configure CMake
      run: |
        # 关键修复！强制传入 MRE_SDK_PATH，解决找不到头文件的问题
        cmake -S . -B build -A Win32 -DMRE_SDK_PATH=$env:GITHUB_WORKSPACE\mre_sdk

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Upload Artifact (打包产物)
      uses: actions/upload-artifact@v4
      with:
        name: MREmu-Windows
        path: bin/
