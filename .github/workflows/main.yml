name: Build MREmu

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Update submodules
      run: git submodule update --init --recursive

    # 1. 下载 SDK 并用 innoextract 解包，直接精准指向 include 目录
    - name: Download and extract MRE SDK
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/raspiduino/mre-sdk/releases/download/1.0.0/MRE_SDK_3.0.00.20_Normal_Eng.zip" -OutFile "mre-sdk.zip"
        Expand-Archive -Path "mre-sdk.zip" -DestinationPath "mre-sdk-temp"
        
        choco install innoextract -y
        innoextract mre-sdk-temp/MRE_SDK_3.0.00.20_Normal_Eng.exe -d "$env:GITHUB_WORKSPACE/mre-sdk-extracted"
        
        # 自动定位 vmgraph.h 所在的 include 文件夹路径
        $vmHeader = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/mre-sdk-extracted" -Filter "vmgraph.h" -Recurse | Select-Object -First 1
        if ($vmHeader) {
            $includeDir = $vmHeader.DirectoryName
            Write-Host "Found Include Directory: $includeDir"
            "MRE_SDK=$includeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
            Write-Error "Could not find vmgraph.h in extracted files!"
            exit 1
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # 2. 配置 CMake
    - name: Configure CMake
      shell: powershell
      run: |
        cmake -B build -DMRE_SDK="$env:MRE_SDK"

    # 3. 编译 Release
    - name: Build project
      shell: powershell
      run: |
        cmake --build build --config Release

    # 4. 上传构建结果
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MREmu-Windows-Release
        path: |
          bin/
          build/bin/Release/
